# ========= Model & Data =========
model: rtdetr-l.pt                     # oder rtdetr-x.pt bei mehr VRAM (Decoder-Dim beachten)
data: ../../datasets/5shot/dataset.yaml          # enthält names: [...] in der richtigen Klassenreihenfolge
device: ""                             # "", "cuda", "cpu"
project: runs_rtdetr
name: rtdetr_5shot_tg_sgd
exist_ok: false

# ========= I/O & Repro =========
imgsz: 1024                             # 960 falls Objekte sehr klein; dann grad_accum erhöhen
batch: 4
workers: 8
seed: 42
rect: true
cache: disk                            # deterministisch (statt 'ram')

# ========= Optimizer & Schedule (SGD) =========
optimizer: SGD
lr0: 0.0005                 
lrf: 0.025                  # cosine final LR fraction
momentum: 0.937
weight_decay: 0.00025
cos_lr: true
warmup_epochs: 3                        # Few-shot mag längeres Warmup
epochs: 300
amp: true
freeze_backbone: -1


# -------------------
# Data augmentation
# -------------------
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.3
shear: 2.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.7               # keep mosaic but reduce for stability
mixup: 0.1
copy_paste: 0.05                      # letzte 50 Epochen „clean“ (mosaic/mixup/copy_paste aus)
close_mosaic: 50

# ========= Loss / Regularization =========
label_smoothing: 0.0

# ========= Validation / Logging =========
val: true
plots: true
save: true
save_json: true                         # COCO-style mAP falls annotes im COCO-Format
verbosity: 0

# ========= Text-Head Settings (für dein Script) =========
# Diese Sektion liest dein Text-Head-Code (nicht Ultralytics selbst).
text_head:
  scale_init: 8.0                      # Temperatur (wirkt wie 1/T); 8–12 ist gut für Start
  class_gain: true                      # pro-Klasse Gain (lernbares Rescaling)
  adapter_learnable: true               # Linear(d_clip -> d_img) trainierbar (Few-shot: JA)
  templates:                            # Prompt-Ensembling – kurz & eindeutig
    - "a photo of a {}."
    - "an image of a {}."
    - "a {} on a table."
    - "a close-up photo of a {}."
    - "a cropped photo of a {}."

# ========= CLIP (OpenAI) =========
# Dein Script lädt OpenAI-CLIP und mittelt Text-Embeddings aus obigen Templates.
clip:
  model: ViT-B/32                       # d_clip=512; passt gut zu d_img=256 via Adapter
model_dim: 512